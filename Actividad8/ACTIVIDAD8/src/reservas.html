<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retiro Sustentable - Reservas</title>
    <link rel="stylesheet" href="./recursos/css/index.css">
</head>
<body>

    <!-- Encabezado con el mismo layout general -->
    <header class="encabezado-principal">
        <a href="index.html">
            <img src="./recursos/imagenes/logo-rs.svg" alt="Isologotipo de Retiro Sustentable">
        </a>
        <nav>
            <ul class="vinculos">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="reservas.html">Reservas</a></li>
            </ul>
        </nav>
    </header>

    <main class="contenido-principal">
        <!-- <h1> único para el título principal -->
        <h1>Reservas</h1>
        
        <div class="contenedor-form">
            <h2>Formulario de Consulta y Reserva</h2>

            <!-- 'action' especifica el destino y 'method' define el método -->
            <form action="#" method="POST">

                <!-- Se une cada input dentro de su <label> para vincularlos automáticamente -->
                <label class="campo-form">
                    Nombre de la persona que consulta:
                    <input type="text" name="nombre" required placeholder="Ej: Juan Pérez">
                </label>

                <label class="campo-form">
                    Teléfono:
                    <input type="tel" name="telefono" required placeholder="Ej: 3511234567">
                </label>

                <label class="campo-form">
                    Email:
                    <input type="email" name="email" required placeholder="ejemplo@correo.com">
                </label>

                <label class="campo-form">
                    Fecha desde:
                    <input type="date" name="fecha_desde" required>
                </label>

                <label class="campo-form">
                    Fecha hasta:
                    <input type="date" name="fecha_hasta" required>
                </label>

                <label class="campo-form">
                    Comentario:
                    <textarea name="comentario" rows="4" placeholder="Escriba su consulta..."></textarea>
                </label>

                <button type="submit">Enviar Consulta</button>
            </form>
        </div>
    </main>

    <!-- Pie de página unificado -->
    <footer class="pie-principal">
        <p>&copy; 2026 Retiro Sustentable. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
